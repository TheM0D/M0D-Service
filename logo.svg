<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#ff8e53" />
    </linearGradient>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="90" fill="#141422" />

  <g transform="translate(200, 200)">
    <polygon points="0,-95 82.3,-47.5 82.3,47.5 0,95 -82.3,47.5 -82.3,-47.5" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linejoin="round" filter="url(#glow)" />
    
    <path d="M -35 -20 L -65 10 L -35 40" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 35 -20 L 65 10 L 35 40" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-18" y1="45" x2="18" y2="-45" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
